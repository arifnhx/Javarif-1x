<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hormuz Oil Chokepoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root { --bg: #05090e; --fg: #e8eef4; --muted: #8a99a8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 16px; box-sizing: border-box; }
  canvas { width: min(100%, calc((100vh - 72px) * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #0a1622; border-radius: 6px; }
  .bar { display: flex; align-items: center; gap: 10px; width: min(100%, calc((100vh - 72px) * 16 / 9)); }
  .bar button { background: #1b2733; color: var(--fg); border: 1px solid #2c3a48; border-radius: 6px; padding: 6px 14px; font: 600 14px Inter, sans-serif; cursor: pointer; }
  .bar input { flex: 1; accent-color: #f6a623; }
  .bar span { font: 500 13px Inter, sans-serif; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render .bar { display: none; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="41" step="0.01" value="0">
  <span id="clock">0.0 / 41.0 s</span>
</div>
<script src="geo.js"></script>
<script src="paths.js"></script>
<script src="scene.js"></script>
<script>
(() => {
  const S = window.SCENE, P = window.PATHS, G = window.GEO;
  const W = S.width, H = S.height;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const FONT = 'Inter, "Inter Display", system-ui, sans-serif';

  // ---------- easing / timing helpers ----------
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = (x) => (x = clamp(x), x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const backOut = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  // 0..1 visibility for a [start, end] window with fades.
  const vis = (t, [a, b], fin = 0.45, fout = 0.4) => clamp((t - a) / fin) * clamp((b - t) / fout);
  const mix = (c1, c2, k) => c1.map((v, i) => v + (c2[i] - v) * k);
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

  const PAL = {
    sea: hex('#0b1a28'), seaLight: hex('#12304a'), land: hex('#1f2a34'), coast: hex('#3c4d5c'),
    iran: hex('#3a3026'), oman: hex('#283a31'), supplier: hex('#4b3a17'), buyer: hex('#123c41'), threat: hex('#7a1e1e'),
    supply: hex('#f6a623'), lng: hex('#8fd3ff'), export: hex('#33d1b6'), red: hex('#ff3b3b'), grey: hex('#6b7884'),
  };

  // ---------- geometry prep: project rings to Mercator once ----------
  function prep(ds) {
    return ds.features.map((f) => ({
      id: f.id, name: f.name,
      rings: f.rings.map((r) => {
        const a = new Float32Array(r.length);
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (let i = 0; i < r.length; i += 2) {
          const [x, y] = P.merc([r[i], r[i + 1]]);
          a[i] = x; a[i + 1] = y;
          x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
        }
        return { a, box: [x0, y0, x1, y1] };
      }),
    }));
  }
  const HI = prep(G.hi), LO = prep(G.lo);
  const hiIds = new Set(HI.map((f) => f.id));
  const LO_ONLY = LO.filter((f) => !hiIds.has(f.id));

  const routes = Object.fromEntries(S.routes.map((r) => [r.id, { ...r, path: P.smooth(r.pts) }]));
  const swarms = S.swarms.map((s) => ({
    ...s,
    path: s.route ? routes[s.route].path : s.pts ? P.smooth(s.pts) : P.ellipse(s.loop),
  }));

  // ---------- camera ----------
  function camAt(t) {
    const B = S.beats;
    let i = B.findIndex((b) => t < b.t1);
    if (i < 0) i = B.length - 1;
    const b = B[i], c1 = b.camera;
    if (i === 0 || !b.move) return { ...c1 };
    const c0 = B[i - 1].camera;
    const e = ease((t - b.t0) / b.move);
    const ls = Math.log(c0.span) + (Math.log(c1.span) - Math.log(c0.span)) * e;
    const span = Math.exp(ls);
    // Move the centre in step with the zoom so the subject stays in frame.
    let u = e;
    if (Math.abs(Math.log(c1.span / c0.span)) > 0.3) u = clamp((span - c0.span) / (c1.span - c0.span));
    const m0 = P.merc(c0.center), m1 = P.merc(c1.center);
    return { m: [m0[0] + (m1[0] - m0[0]) * u, m0[1] + (m1[1] - m0[1]) * u], span, tilt: c0.tilt + (c1.tilt - c0.tilt) * e };
  }

  let CAM; // { cx, cy, s, sinT, cosT, f }
  function setCam(c) {
    const m = c.m || P.merc(c.center);
    const tr = (c.tilt * Math.PI) / 180;
    CAM = { cx: m[0], cy: m[1], s: W / c.span, sinT: Math.sin(tr), cosT: Math.cos(tr), f: 1.3 * W, span: c.span, tilt: c.tilt };
  }
  // Mercator (deg) -> screen. Returns [x, y, k] with k = perspective scale.
  function proj(X, Y) {
    const gx = (X - CAM.cx) * CAM.s, gy = (Y - CAM.cy) * CAM.s;
    const z = CAM.f + gy * CAM.sinT;
    const k = CAM.f / Math.max(z, CAM.f * 0.08);
    return [W / 2 + gx * k, H / 2 + 40 * CAM.sinT - gy * CAM.cosT * k, k];
  }
  const projLL = (ll) => { const m = P.merc(ll); return proj(m[0], m[1]); };
  function viewBox() {
    // Generous Mercator bounds of what can be on screen (for culling).
    const hw = CAM.span * 0.62 * (1 + CAM.sinT * 1.4);
    const hh = (CAM.span * H) / W * 0.62 * (1 + CAM.sinT * 6);
    return [CAM.cx - hw, CAM.cy - hh * (CAM.sinT ? 0.6 : 1), CAM.cx + hw, CAM.cy + hh];
  }

  // ---------- map ----------
  function landTone(id, t) {
    let c = PAL.land;
    for (const h of S.highlights) {
      const ids = h.ids || [h.id];
      if (!ids.includes(id)) continue;
      let a = 0;
      for (const w of h.on) a = Math.max(a, vis(t, w, 0.8, 0.6));
      if (h.tone === 'threat') a *= 0.75 + 0.25 * Math.sin(t * 5);
      c = mix(c, PAL[h.tone], a);
    }
    return c;
  }
  function drawMap(t) {
    const g = ctx.createRadialGradient(W / 2, H * 0.55, 80, W / 2, H * 0.55, W * 0.75);
    g.addColorStop(0, rgb(PAL.seaLight)); g.addColorStop(1, rgb(PAL.sea));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    drawGraticule(t);

    const vb = viewBox();
    const useHi = CAM.span < 30;
    const sets = useHi ? [LO_ONLY, HI] : [LO];
    const step = CAM.span > 60 ? 2 : 1;
    for (const set of sets) {
      for (const f of set) {
        ctx.beginPath();
        let any = false;
        for (const r of f.rings) {
          const [x0, y0, x1, y1] = r.box;
          if (x1 < vb[0] || x0 > vb[2] || y1 < vb[1] || y0 > vb[3]) continue;
          any = true;
          const a = r.a;
          let p = proj(a[0], a[1]);
          ctx.moveTo(p[0], p[1]);
          for (let i = 2 * step; i < a.length; i += 2 * step) { p = proj(a[i], a[i + 1]); ctx.lineTo(p[0], p[1]); }
          ctx.closePath();
        }
        if (!any) continue;
        ctx.fillStyle = rgb(landTone(f.id, t));
        ctx.fill('evenodd');
        ctx.strokeStyle = rgb(PAL.coast, 0.9);
        ctx.lineWidth = CAM.span < 10 ? 1.6 : 1;
        ctx.stroke();
      }
    }
    // Depth haze toward the horizon when tilted.
    if (CAM.sinT > 0.01) {
      const hz = ctx.createLinearGradient(0, 0, 0, H * 0.5);
      hz.addColorStop(0, `rgba(10,22,34,${0.85 * CAM.sinT})`);
      hz.addColorStop(1, 'rgba(10,22,34,0)');
      ctx.fillStyle = hz; ctx.fillRect(0, 0, W, H * 0.5);
    }
  }
  function drawGraticule() {
    const stepDeg = CAM.span > 40 ? 10 : CAM.span > 10 ? 2 : 1;
    const vb = viewBox();
    ctx.strokeStyle = 'rgba(120,160,190,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const lon0 = Math.floor(vb[0] / stepDeg) * stepDeg;
    const [, lat0] = P.unmerc([0, vb[1]]), [, lat1] = P.unmerc([0, vb[3]]);
    for (let lon = lon0; lon <= vb[2]; lon += stepDeg) {
      for (let lat = Math.max(-80, lat0); lat <= Math.min(80, lat1); lat += stepDeg / 4) {
        const p = projLL([lon, lat]);
        lat === Math.max(-80, lat0) ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]);
      }
    }
    for (let lat = Math.ceil(lat0 / stepDeg) * stepDeg; lat <= lat1; lat += stepDeg) {
      for (let lon = lon0; lon <= vb[2]; lon += stepDeg / 4) {
        const p = projLL([lon, lat]);
        lon === lon0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]);
      }
    }
    ctx.stroke();
  }

  // ---------- routes ----------
  const blockadeK = (t) => vis(t, S.blockade.on, 0.8, 0.8);
  function strokePath(path, d0, d1, stepPts = 1) {
    const { pts, cum } = path;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < pts.length; i += stepPts) {
      if (cum[i] < d0) continue;
      if (cum[i] > d1) break;
      const p = proj(pts[i][0], pts[i][1]);
      started ? ctx.lineTo(p[0], p[1]) : (ctx.moveTo(p[0], p[1]), started = true);
    }
    const e = P.at(path, d1), p = proj(e.x, e.y);
    started ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
    return p;
  }
  function drawRoutes(t) {
    const bk = blockadeK(t);
    // Routes recede in the close-up risk and navy beats so the strait reads.
    const dim = (1 - 0.55 * vis(t, [20.8, 34.3], 1.0, 1.0)) * (1 - 0.5 * vis(t, [28.2, 34.3], 0.8, 0.8));
    for (const r of Object.values(routes)) {
      const prog = easeOut((t - r.draw[0]) / (r.draw[1] - r.draw[0]));
      if (prog <= 0) continue;
      const a = vis(t, [r.draw[0], r.off], 0.3, 0.5) * dim;
      if (a <= 0) continue;
      let col = PAL[r.kind];
      // A closure cuts the flow: everything greys out while the ring is up.
      col = mix(col, PAL.grey, 0.75 * bk);
      const wScale = clamp(Math.pow(30 / CAM.span, 0.25), 0.7, 1.6) * (r.weight || 1);
      const L = r.path.length * prog;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      strokePath(r.path, 0, L);
      ctx.strokeStyle = rgb(col, 0.18 * a); ctx.lineWidth = 16 * wScale; ctx.stroke();
      strokePath(r.path, 0, L);
      ctx.strokeStyle = rgb(col, 0.85 * a); ctx.lineWidth = 3.6 * wScale; ctx.stroke();
      // Flowing dashes show direction of travel.
      const head = strokePath(r.path, 0, L);
      ctx.setLineDash([2, 22 * wScale]);
      ctx.lineDashOffset = -t * 60 * (1 - bk);
      ctx.strokeStyle = rgb([255, 255, 255], 0.85 * a * (1 - 0.7 * bk)); ctx.lineWidth = 3.4 * wScale; ctx.stroke();
      ctx.setLineDash([]);
      if (prog < 1) {
        ctx.beginPath(); ctx.arc(head[0], head[1], 7 * wScale, 0, Math.PI * 2);
        ctx.fillStyle = rgb(col, a); ctx.fill();
      }
    }
  }

  // ---------- swarms ----------
  function screenHeading(x, y, h) {
    const a = proj(x, y), b = proj(x + Math.cos(h) * 0.01, y + Math.sin(h) * 0.01);
    return [a, Math.atan2(b[1] - a[1], b[0] - a[0])];
  }
  function drawTanker(x, y, h, a, kind) {
    const [p, ang] = screenHeading(x, y, h);
    const sc = clamp(Math.pow(12 / CAM.span, 0.3), 0.55, 1.5) * p[2];
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(ang); ctx.scale(sc, sc);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-30, -6); ctx.lineTo(-30, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(13, 0); ctx.lineTo(8, -5); ctx.lineTo(-11, -5); ctx.lineTo(-11, 5); ctx.lineTo(8, 5); ctx.closePath();
    ctx.fillStyle = kind === 'lng' ? '#d9f1ff' : '#f2c46b'; ctx.fill();
    ctx.strokeStyle = 'rgba(5,10,15,0.8)'; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillRect(-10, -3.5, 4, 7);
    if (kind === 'lng') { ctx.fillStyle = '#7fb4d6'; for (const u of [-3, 2.5, 8 - 1]) { ctx.beginPath(); ctx.arc(u, 0, 2.4, 0, 7); ctx.fill(); } }
    ctx.restore();
  }

  // Warship drawn in ground space so it foreshortens with the camera tilt.
  const HULL = (b) => [[0.5, 0], [0.34, b], [0.1, b * 1.1], [-0.44, b], [-0.5, b * 0.75], [-0.5, -b * 0.75], [-0.44, -b], [0.1, -b * 1.1], [0.34, -b]];
  function shipPoly(x, y, h, len, pts) {
    const c = Math.cos(h), s = Math.sin(h);
    return pts.map(([u, v]) => proj(x + (u * c + v * s) * len, y + (u * s - v * c) * len));
  }
  function fillPoly(ps, fill, stroke, lw = 1) {
    ctx.beginPath(); ps.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  }
  const rect = (u0, u1, v0, v1) => [[u1, v0], [u1, v1], [u0, v1], [u0, v0]];
  function drawWarship(sw, d, a) {
    const pos = P.at(sw.path, d);
    const len = 0.28 * (sw.size || 1), b = 0.09;
    ctx.globalAlpha = a;
    // Wake: a foam trail that follows the path behind the stern.
    for (let j = 1; j <= 16; j++) {
      let dd = d - j * len * 0.16;
      if (sw.loop) dd = (dd + sw.path.length) % sw.path.length;
      else if (dd < 0) break;
      const q = P.at(sw.path, dd), p = proj(q.x, q.y);
      ctx.beginPath(); ctx.arc(p[0], p[1], (2 + j * 0.55) * p[2] * (CAM.s / 270) * (len / 0.2), 0, 7);
      ctx.fillStyle = `rgba(220,238,255,${0.16 * (1 - j / 17)})`; ctx.fill();
    }
    // Bow wave.
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, [[0.62, 0], [0.2, b * 2.6], [0.1, b * 1.3], [0.1, -b * 1.3], [0.2, -b * 2.6]]), 'rgba(220,238,255,0.18)');
    // Shadow, hull, deck details.
    fillPoly(shipPoly(pos.x + 0.008, pos.y - 0.01, pos.heading, len, HULL(b)), 'rgba(0,0,0,0.35)');
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, HULL(b)), '#8f9ba6', '#121a21', 1.4);
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, HULL(b * 0.72).map(([u, v]) => [u * 0.94, v])), '#76838f');
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, rect(-0.2, 0.08, -b * 0.62, b * 0.62)), '#c9d2da', '#3b4651', 0.8);
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, rect(-0.1, -0.02, -b * 0.4, b * 0.4)), '#eef2f5');
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, rect(0.14, 0.24, -b * 0.45, b * 0.45)), '#5d6a76');
    fillPoly(shipPoly(pos.x, pos.y, pos.heading, len, rect(-0.47, -0.3, -b * 0.7, b * 0.7)), '#6b7884');
    const gun = shipPoly(pos.x, pos.y, pos.heading, len, [[0.3, 0], [0.42, 0]]);
    ctx.beginPath(); ctx.arc(gun[0][0], gun[0][1], 3.2 * gun[0][2] * (CAM.s / 270), 0, 7); ctx.fillStyle = '#dfe5ea'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(gun[0][0], gun[0][1]); ctx.lineTo(gun[1][0], gun[1][1]); ctx.strokeStyle = '#dfe5ea'; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
    return pos;
  }

  function drawSwarms(t) {
    let lead = null;
    for (const sw of swarms) {
      const a0 = vis(t, sw.on, 0.6, 0.5);
      if (a0 <= 0) continue;
      const el = t - sw.on[0];
      if (sw.kind === 'warship') {
        const L = sw.path.length;
        for (let i = 0; i < sw.count; i++) {
          let d;
          if (sw.column) {
            d = sw.lead + el * sw.speedDeg - i * sw.gapDeg;
            if (d < 0 || d > L) continue;
          } else {
            d = ((sw.phase || 0) * L + el * sw.speedDeg + (i * L) / sw.count) % L;
          }
          const fadeEnds = sw.column ? clamp(d / 0.15) * clamp((L - d) / 0.15) : 1;
          const pos = drawWarship(sw, d, a0 * fadeEnds);
          if (sw.column && i === 0) lead = pos;
        }
      } else if (sw.column) {
        const L = sw.path.length;
        for (let i = 0; i < sw.count; i++) {
          const d = sw.lead + el * sw.speedDeg - i * sw.gapDeg;
          if (d < 0 || d > L) continue;
          const q = P.at(sw.path, d);
          drawTanker(q.x, q.y, q.heading, a0 * clamp(d / 0.2) * clamp((L - d) / 0.2), sw.kind);
        }
      } else {
        const r = routes[sw.route];
        const prog = easeOut((t - r.draw[0]) / (r.draw[1] - r.draw[0]));
        const n = Math.round(1 / sw.every);
        const bk = blockadeK(t);
        for (let i = 0; i < n; i++) {
          const f = ((sw.phase || 0) + el * sw.speed * (1 - bk) + i * sw.every) % 1;
          if (f > prog) continue;
          const q = P.at(sw.path, f * sw.path.length);
          drawTanker(q.x, q.y, q.heading, a0 * clamp(f / 0.04) * clamp((1 - f) / 0.04), sw.kind);
        }
      }
    }
    return lead;
  }

  // ---------- flags (vector, no images) ----------
  function star(cx, cy, r, rot = -Math.PI / 2) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.382 : r, a = rot + (i * Math.PI) / 5;
      i ? ctx.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)) : ctx.moveTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a));
    }
    ctx.closePath(); ctx.fill();
  }
  const bands = (w, h, cols, x0 = 0) => cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x0, (i * h) / cols.length, w - x0, h / cols.length + 0.5); });
  const FLAGS = {
    IR(w, h) {
      bands(w, h, ['#239f40', '#ffffff', '#da0000']);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for (let i = 0; i < 11; i++) { ctx.fillRect(2 + i * (w - 4) / 11, h / 3 - 2, (w - 4) / 22, 1.5); ctx.fillRect(2 + i * (w - 4) / 11, (2 * h) / 3 + 0.5, (w - 4) / 22, 1.5); }
      ctx.strokeStyle = '#da0000'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(w / 2 - 2.5, h / 2, 4, -1.9, 1.9, true); ctx.stroke();
      ctx.beginPath(); ctx.arc(w / 2 + 2.5, h / 2, 4, Math.PI - 1.9, Math.PI + 1.9, true); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w / 2, h / 2 - 5); ctx.lineTo(w / 2, h / 2 + 5); ctx.stroke();
    },
    OM(w, h) {
      bands(w, h, ['#ffffff', '#db161b', '#008000']);
      ctx.fillStyle = '#db161b'; ctx.fillRect(0, 0, w * 0.27, h); ctx.fillRect(0, h / 3, w, h / 3);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(w * 0.06, h * 0.08); ctx.lineTo(w * 0.21, h * 0.3); ctx.moveTo(w * 0.21, h * 0.08); ctx.lineTo(w * 0.06, h * 0.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(w * 0.135, h * 0.17, 3, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();
    },
    SA(w, h) {
      ctx.fillStyle = '#006c35'; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
      for (let row = 0; row < 2; row++) {
        ctx.beginPath();
        for (let x = w * 0.2; x <= w * 0.8; x += 1) ctx.lineTo(x, h * (0.28 + row * 0.14) + Math.sin(x * 0.9 + row) * 1.6);
        ctx.stroke();
      }
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(w * 0.22, h * 0.7); ctx.lineTo(w * 0.78, h * 0.7); ctx.lineTo(w * 0.72, h * 0.64); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w * 0.3, h * 0.65); ctx.lineTo(w * 0.3, h * 0.75); ctx.stroke();
    },
    AE(w, h) {
      bands(w, h, ['#00732f', '#ffffff', '#000000']);
      ctx.fillStyle = '#ff0000'; ctx.fillRect(0, 0, w * 0.25, h);
    },
    QA(w, h) {
      ctx.fillStyle = '#8a1538'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w * 0.3, 0);
      const n = 9;
      for (let i = 0; i < n; i++) { ctx.lineTo(w * 0.42, (h * (i + 0.5)) / n); ctx.lineTo(w * 0.3, (h * (i + 1)) / n); }
      ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
    },
    CN(w, h) {
      ctx.fillStyle = '#de2910'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffde00';
      star(w * 0.17, h * 0.27, h * 0.16);
      [[0.33, 0.1], [0.4, 0.2], [0.4, 0.35], [0.33, 0.45]].forEach(([x, y]) => star(w * x, h * y, h * 0.055, Math.atan2(h * 0.27 - h * y, w * 0.17 - w * x)));
    },
    IN(w, h) {
      bands(w, h, ['#ff9933', '#ffffff', '#138808']);
      ctx.strokeStyle = '#000080'; ctx.lineWidth = 1.1;
      const r = h * 0.14;
      ctx.beginPath(); ctx.arc(w / 2, h / 2, r, 0, 7); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 24; i++) { const a = (i * Math.PI) / 12; ctx.moveTo(w / 2, h / 2); ctx.lineTo(w / 2 + r * Math.cos(a), h / 2 + r * Math.sin(a)); }
      ctx.lineWidth = 0.5; ctx.stroke();
    },
    JP(w, h) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#bc002d'; ctx.beginPath(); ctx.arc(w / 2, h / 2, h * 0.3, 0, 7); ctx.fill();
    },
  };

  function drawFlagCard(fl, t) {
    const a = vis(t, fl.on, 0.35, 0.35);
    if (a <= 0) return;
    const p = projLL(fl.at);
    const pop = backOut((t - fl.on[0]) / 0.45);
    const big = fl.big ? 1.15 : fl.mini ? 0.8 : 1;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p[0], p[1]);
    // Anchor dot.
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 6 + 8 * ((t * 1.2) % 1), 0, 7); ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - ((t * 1.2) % 1))})`; ctx.lineWidth = 2; ctx.stroke();
    if (fl.offset) {
      const [ox, oy] = fl.offset, dirx = fl.side === 'left' ? -18 : 18;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo((ox + dirx) * pop, oy * pop); ctx.stroke();
      ctx.translate(ox * pop, oy * pop);
    }
    ctx.scale(pop * big, pop * big);
    const dir = fl.side === 'left' ? -1 : 1;
    const fw = fl.plain ? 0 : 60, fh = 40;
    ctx.font = `700 30px ${FONT}`;
    const nameW = ctx.measureText(fl.name).width;
    ctx.font = `500 21px ${FONT}`;
    const noteW = fl.note ? ctx.measureText(fl.note).width : 0;
    const tw = Math.max(nameW, noteW);
    const cw = (fw ? fw + 14 : 0) + tw + 28, ch = fl.note ? 74 : 56;
    const x0 = dir > 0 ? 18 : -18 - cw, y0 = -ch / 2;
    ctx.fillStyle = 'rgba(8,14,20,0.82)';
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(x0, y0, cw, ch, 10); ctx.fill(); ctx.stroke();
    let tx = x0 + 14;
    if (fw) {
      ctx.save();
      ctx.translate(tx, -fh / 2);
      ctx.beginPath(); ctx.roundRect(0, 0, fw, fh, 4); ctx.clip();
      FLAGS[fl.code](fw, fh);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(tx, -fh / 2, fw, fh, 4); ctx.stroke();
      tx += fw + 14;
    }
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff'; ctx.font = `700 30px ${FONT}`;
    ctx.fillText(fl.name, tx, fl.note ? -12 : 1);
    if (fl.note) { ctx.fillStyle = '#f6c56b'; ctx.font = `500 21px ${FONT}`; ctx.fillText(fl.note, tx, 19); }
    ctx.restore();
  }

  // ---------- labels / overlays ----------
  function spaced(text, x, y, spacing) {
    ctx.textAlign = 'left';
    let w = 0;
    for (const ch of text) w += ctx.measureText(ch).width + spacing;
    w -= spacing;
    let cx = x - w / 2;
    for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + spacing; }
    return w;
  }
  function drawLabels(t) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (const lb of S.labels) {
      const a = vis(t, lb.on, 0.5, 0.4);
      if (a <= 0) continue;
      const p = projLL(lb.at);
      ctx.save(); ctx.globalAlpha = a;
      if (lb.sea) {
        ctx.font = `italic 500 24px ${FONT}`; ctx.fillStyle = 'rgba(160,195,220,0.75)';
        spaced(lb.text, p[0], p[1], 6);
      } else if (lb.chip) {
        pulseDot(p, t, '#ff5a5a');
        ctx.font = `700 22px ${FONT}`;
        const tw = ctx.measureText(lb.text).width;
        const x = p[0] + 22, y = p[1] - 44;
        ctx.strokeStyle = 'rgba(255,90,90,0.8)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(p[0] + 6, p[1] - 6); ctx.lineTo(x + 4, y + 18); ctx.stroke();
        ctx.fillStyle = 'rgba(40,8,8,0.85)';
        ctx.beginPath(); ctx.roundRect(x, y - 18, tw + 28, 36, 18); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillText(lb.text, x + 14, y + 1);
      } else if (lb.hero) {
        const rise = easeOut((t - lb.on[0]) / 0.8);
        pulseDot(p, t, '#ffffff');
        const ly = p[1] - 170 - 20 * (1 - rise);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p[0], p[1] - 12); ctx.lineTo(p[0], ly + 40); ctx.stroke();
        ctx.font = `800 70px ${FONT}`;
        ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 24;
        ctx.fillStyle = '#ffffff';
        const w = spaced(lb.text, p[0], ly, 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f6a623'; ctx.fillRect(p[0] - w / 2, ly + 46, w * rise, 4);
      }
      ctx.restore();
    }
  }
  function pulseDot(p, t, col) {
    const ph = (t * 0.9) % 1;
    ctx.beginPath(); ctx.arc(p[0], p[1], 7, 0, 7); ctx.fillStyle = col; ctx.fill();
    ctx.beginPath(); ctx.arc(p[0], p[1], 7 + 26 * ph, 0, 7); ctx.strokeStyle = col; ctx.globalAlpha *= 1 - ph; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.globalAlpha /= Math.max(1 - ph, 1e-3);
  }

  function drawNarrows(t) {
    const n = S.narrows, a = vis(t, n.on, 0.5, 0.5);
    if (a <= 0) return;
    const pa = projLL(n.a), pb = projLL(n.b);
    const g = easeOut((t - n.on[0]) / 1.0);
    const mx = pa[0] + (pb[0] - pa[0]) * g, my = pa[1] + (pb[1] - pa[1]) * g;
    ctx.save(); ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(mx, my); ctx.stroke(); ctx.setLineDash([]);
    const nx = -(pb[1] - pa[1]), ny = pb[0] - pa[0], nl = Math.hypot(nx, ny);
    for (const p of [pa, [mx, my]]) {
      ctx.beginPath(); ctx.moveTo(p[0] - (nx / nl) * 14, p[1] - (ny / nl) * 14); ctx.lineTo(p[0] + (nx / nl) * 14, p[1] + (ny / nl) * 14); ctx.stroke();
    }
    if (g > 0.6) {
      ctx.globalAlpha = a * clamp((g - 0.6) / 0.4);
      ctx.font = `800 38px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const lx = (pa[0] + pb[0]) / 2 + 30, ly = (pa[1] + pb[1]) / 2;
      const tw = ctx.measureText(n.label).width;
      ctx.fillStyle = 'rgba(8,14,20,0.85)'; ctx.beginPath(); ctx.roundRect(lx - 14, ly - 30, tw + 28, 60, 10); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillText(n.label, lx, ly + 1);
    }
    ctx.restore();
  }

  function drawBlockade(t) {
    const B = S.blockade;
    for (const w of [B.on, B.reprise]) {
      const a = vis(t, w, 0.6, 0.6);
      if (a <= 0) continue;
      const m = P.merc(B.at), p = proj(m[0], m[1]);
      const rGround = 0.34 * CAM.s * p[2];
      const r = Math.max(rGround, 30);
      const grow = backOut((t - w[0]) / 0.7);
      ctx.save(); ctx.globalAlpha = a;
      ctx.translate(p[0], p[1]); ctx.scale(1, CAM.cosT || 1);
      ctx.beginPath(); ctx.arc(0, 0, r * grow, 0, 7); ctx.fillStyle = 'rgba(255,40,40,0.16)'; ctx.fill();
      for (let k = 0; k < 2; k++) {
        const ph = ((t * 0.7 + k * 0.5) % 1);
        ctx.beginPath(); ctx.arc(0, 0, r * grow * (1 + ph * 0.6), 0, 7);
        ctx.strokeStyle = `rgba(255,59,59,${0.5 * (1 - ph)})`; ctx.lineWidth = 3; ctx.stroke();
      }
      ctx.rotate(t * 0.6);
      ctx.setLineDash([18, 10]);
      ctx.beginPath(); ctx.arc(0, 0, r * grow, 0, 7); ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = Math.max(4, r * 0.035); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      // Barrier across the narrows (close-up only).
      if (w === B.on) {
        const pa = projLL(S.narrows.a), pb = projLL(S.narrows.b);
        ctx.save(); ctx.globalAlpha = a * clamp((t - w[0] - 0.4) / 0.5);
        ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 9; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
        ctx.font = `800 30px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const lx = p[0] - r - 120, ly = p[1] + r * 0.2;
        ctx.fillStyle = 'rgba(60,6,6,0.9)'; ctx.beginPath(); ctx.roundRect(lx - 110, ly - 26, 220, 52, 26); ctx.fill();
        ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.fillText('CLOSURE', lx, ly + 1);
        ctx.restore();
      }
    }
  }

  function drawNavyTag(t, lead) {
    const a = vis(t, [29.4, 34.3], 0.5, 0.4);
    if (a <= 0 || !lead) return;
    const p = proj(lead.x, lead.y);
    ctx.save(); ctx.globalAlpha = a;
    const x = p[0] + 40, y = p[1] + 70;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p[0] + 8, p[1] + 10); ctx.lineTo(x, y - 16); ctx.stroke();
    ctx.font = `700 24px ${FONT}`; ctx.textBaseline = 'middle';
    const tw = ctx.measureText('US Navy warships').width;
    ctx.fillStyle = 'rgba(8,14,20,0.85)'; ctx.beginPath(); ctx.roundRect(x - 4, y - 18, tw + 28, 38, 19); ctx.fill();
    ctx.strokeStyle = 'rgba(160,190,215,0.6)'; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.fillText('US Navy warships', x + 10, y + 1);
    ctx.restore();
  }

  function drawStats(t) {
    for (const st of S.stats) {
      const a = vis(t, st.on, 0.5, 0.4);
      if (a <= 0) continue;
      const slide = 1 - easeOut((t - st.on[0]) / 0.6);
      ctx.save(); ctx.globalAlpha = a;
      ctx.textAlign = st.left ? 'left' : 'right'; ctx.textBaseline = 'alphabetic';
      const x = st.left ? 96 - 40 * slide : W - 96 + 40 * slide, y = st.y || 210;
      ctx.font = `800 ${st.big.length > 8 ? 64 : 112}px ${FONT}`;
      ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 20;
      ctx.fillStyle = '#ffffff'; ctx.fillText(st.big, x, y);
      ctx.font = `600 30px ${FONT}`; ctx.fillStyle = '#f6c56b';
      ctx.fillText(st.small, x, y + 50);
      ctx.restore();
    }
  }

  function drawChrome(t) {
    const B = S.beats;
    const i = Math.max(0, B.findIndex((b) => t < b.t1));
    const b = B[i < 0 ? B.length - 1 : i];
    const a = vis(t, [b.t0, b.t1], 0.4, 0.3);
    // Vignette.
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    // Kicker.
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = '#f6a623'; ctx.fillRect(96, 92, 46, 5);
    ctx.font = `700 26px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let x = 160;
    for (const ch of b.kicker) { ctx.fillText(ch, x, 95); x += ctx.measureText(ch).width + 4; }
    ctx.restore();
    // Caption (narration), revealed word by word.
    const words = b.narration.split(' ');
    const dur = Math.min(b.t1 - b.t0 - 1.0, words.length / 3.3);
    const shown = clamp((t - b.t0 - 0.25) / dur) * words.length;
    const band = ctx.createLinearGradient(0, H - 260, 0, H);
    band.addColorStop(0, 'rgba(0,0,0,0)'); band.addColorStop(1, 'rgba(0,0,0,0.78)');
    ctx.fillStyle = band; ctx.fillRect(0, H - 260, W, 260);
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `600 44px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const lines = []; let line = [];
    for (const w of words) {
      const test = [...line, w].join(' ');
      if (ctx.measureText(test).width > 1500 && line.length) { lines.push(line); line = [w]; } else line.push(w);
    }
    lines.push(line);
    let k = 0;
    lines.forEach((ln, li) => {
      const full = ln.join(' ');
      let cx = W / 2 - ctx.measureText(full).width / 2;
      const y = H - 80 - (lines.length - 1 - li) * 58;
      for (const w of ln) {
        const wa = clamp(shown - k);
        ctx.fillStyle = `rgba(255,255,255,${0.12 + 0.88 * wa})`;
        ctx.fillText(w, cx, y);
        cx += ctx.measureText(w + ' ').width; k++;
      }
    });
    ctx.restore();
  }

  // Darkens the band behind the end title; drawn under the flag cards.
  function drawEndBackdrop(t) {
    const a = vis(t, S.endCard.on, 0.7, 0.01);
    if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(W / 2, 230); ctx.scale(1, 0.22);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 760);
    g.addColorStop(0, 'rgba(5,10,16,0.8)'); g.addColorStop(0.7, 'rgba(5,10,16,0.55)'); g.addColorStop(1, 'rgba(5,10,16,0)');
    ctx.fillStyle = g; ctx.fillRect(-W / 2, -800, W, 1600);
    ctx.restore();
  }
  function drawEndCard(t) {
    const e = S.endCard, a = vis(t, e.on, 0.7, 0.01);
    if (a <= 0) return;
    const rise = easeOut((t - e.on[0]) / 0.9);
    ctx.save(); ctx.globalAlpha = a;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 28;
    ctx.font = `800 92px ${FONT}`; ctx.fillStyle = '#ffffff';
    spaced(e.line1, W / 2, 230 + 20 * (1 - rise), 8);
    ctx.textAlign = 'center';
    ctx.font = `600 40px ${FONT}`; ctx.fillStyle = '#f6c56b';
    ctx.fillText(e.line2, W / 2, 296 + 20 * (1 - rise));
    ctx.restore();
  }

  // ---------- frame ----------
  function renderAt(t) {
    setCam(camAt(t));
    ctx.save();
    drawMap(t);
    drawRoutes(t);
    drawNarrows(t);
    drawBlockade(t);
    const lead = drawSwarms(t);
    drawLabels(t);
    drawEndBackdrop(t);
    for (const fl of S.flags) drawFlagCard(fl, t);
    drawNavyTag(t, lead);
    drawStats(t);
    drawEndCard(t);
    drawChrome(t);
    // Fade from/to black at the very ends.
    const fade = Math.max(1 - clamp(t / 0.5), clamp((t - (S.duration - 0.6)) / 0.6));
    if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }
  window.renderAt = renderAt;

  // ---------- player ----------
  const params = new URLSearchParams(location.search);
  const scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), btn = document.getElementById('play');
  scrub.max = S.duration;
  let t = +(params.get('t') || 0), playing = !params.has('render') && !params.has('t'), last = null;
  const show = () => { renderAt(t); scrub.value = t; clock.textContent = `${t.toFixed(1)} / ${S.duration.toFixed(1)} s`; };
  function loop(now) {
    if (playing) {
      if (last != null) t += (now - last) / 1000;
      if (t >= S.duration) t = 0;
      show();
    }
    last = now;
    requestAnimationFrame(loop);
  }
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; };
  scrub.oninput = () => { t = +scrub.value; playing = false; btn.textContent = 'Play'; show(); };
  addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); btn.click(); } });
  if (params.has('render')) document.body.classList.add('render');
  window.ready = document.fonts.ready.then(() => { show(); if (!params.has('render')) requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
